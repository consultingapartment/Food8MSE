name: analyze

# Санхүүгийн тайлан татахгүйгээр зөвхөн шинжилгээг дахин тооцоолно.
# Ажиллах нөхцөл: inputs/ (ханш, ногдол, эзэмшил, арилжааны түүх) эсвэл FOOD mse.xlsx-г гараар өөрчилсөн, эсвэл товчоор.
on:
  push:
    branches: [main]
    paths:
      - "inputs/**"
      - "reports/FOOD mse.xlsx"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analyze
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: МХБ-ээс хуулсан арилжааны түүх байвал inputs/prices руу нэмэх
        run: |
          if [ -f inputs/trade_history.txt ]; then
            python -m mse_analysis -v --import-trades inputs/trade_history.txt --charts
          else
            python -m mse_analysis -v --charts
          fi
      - name: Өөрчлөлтийг commit хийх
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add "reports/FOOD analysis.xlsx" reports/charts inputs/prices
          git diff --cached --quiet || git commit -m "analysis: шинжилгээ шинэчлэв"
          git push
