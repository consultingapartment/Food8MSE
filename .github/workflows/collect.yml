name: collect-reports

on:
  schedule:
    - cron: "0 2 24 2 *"
    - cron: "0 2 14 5 *"
    - cron: "0 2 3 8 *"
    - cron: "0 2 13 11 *"
    - cron: "0 3 1 * *"        # keepalive (60 хоног идэвхгүй repo-ийн хуваарийг унтраахаас сэргийлнэ)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt
      - name: Тайлан татаж FOOD mse.xlsx шинэчлэх
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m mse_financials -v --if-due --notify
      - name: Шинжилгээг шинэчлэх (FOOD analysis.xlsx)
        run: python -m mse_analysis -v
      - name: Өөрчлөлтийг commit хийх
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "reports: шинэ тайлан, шинжилгээ шинэчлэв"
          git push

  keepalive:
    if: github.event.schedule == '0 3 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > .keepalive
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" || true
          git push
