name: collect-reports

on:
  schedule:
    # Жил бүрийн 4-р сарын 1-ний 10:00 цагт (Улаанбаатар, UTC+8) — Жилийн эцсийн тайлан
    - cron: "0 2 1 4 *"
    # Жил бүрийн 8-р сарын 15-ны 10:00 цагт (Улаанбаатар, UTC+8) — Хагас жилийн тайлан
    - cron: "0 2 15 8 *"
    # keepalive (60 хоног идэвхгүй repo-ийн хуваарийг унтраахаас сэргийлнэ)
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    if: github.event.schedule != '0 3 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt
      - name: Тайлан татаж FOOD mse.xlsx шинэчлэх
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # заавал биш: зөвхөн скан PDF-ийн нөөц унших
        run: python -m mse_financials -v --if-due --notify
      - name: Шинжилгээг шинэчлэх, зураг гаргаж Telegram-д илгээх
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m mse_analysis -v --charts --notify
      - name: Өөрчлөлтийг commit хийх
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "reports: шинэ тайлан, шинжилгээ шинэчлэв"
          git push

  keepalive:
    if: github.event.schedule == '0 3 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > .keepalive
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" || true
          git push
