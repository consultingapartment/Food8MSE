name: prices

# Мягмар–Бямба өглөө 09:00 (Улаанбаатар) — өмнөх арилжааны өдрийн хаалт арилжааны түүхэнд орсны дараа
# ханшийг татаж, шинжилгээ хийж, харьцуулсан зураг + Excel-ийг Telegram-д илгээнэ.
on:
  schedule:
    - cron: "0 1 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analyze
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ханш татаж шинжилгээ хийх, зураг гаргаж Telegram-д илгээх
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m mse_analysis -v --fetch-prices --charts --notify
      - name: Хариуны түүхий өгөгдлийг хадгалах (алдааг оношлоход)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-trading-responses
          path: inputs/_raw/
          if-no-files-found: ignore
          retention-days: 7
      - name: Өөрчлөлтийг commit хийх
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add inputs/market.csv inputs/prices "reports/FOOD analysis.xlsx" reports/charts
          git diff --cached --quiet || git commit -m "prices: сүүлийн хаалтын ханш шинэчлэв"
          git push
